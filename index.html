const stage=document.getElementById('stage'),strip=document.getElementById('strip'),bar=document.getElementById('bar'),ticks=[...document.querySelectorAll('.tick')];
const rail=[...document.querySelectorAll('.rail button')],rfill=document.getElementById('rfill');
function segTop(i){const total=stage.offsetHeight-innerHeight,p=i<0?0:.1+.9*((i+.5)/5);return stage.offsetTop+p*total}
rail.forEach(b=>b.onclick=()=>go(+b.dataset.i));
let snapT=null,lastIdx=-1;
let lock=0,acc=0,goal=null,lastWheel=0,used=false,lastDir=0,trough=0,rise=0;
function inStage(){const r=stage.getBoundingClientRect();return r.top<=1&&r.bottom>=innerHeight-1}
function go(i){i=Math.max(-1,Math.min(4,i));goal=i;lock=performance.now()+750;scrollTo({top:segTop(i),behavior:'smooth'})}
// wheel/trackpad: one gesture = one company
addEventListener('wheel',e=>{if(!inStage())return;const cur=goal??lastIdx;
 if((cur===4&&e.deltaY>0)||(cur===-1&&e.deltaY<0&&stage.getBoundingClientRect().top>=-2))return;
 e.preventDefault();const now=performance.now(),a=Math.abs(e.deltaY),dir=Math.sign(e.deltaY);
 // new gesture: a pause, a direction change, or (after the move settles) a surge above the fading inertia
 rise=(used&&now>lock&&a>Math.max(trough*2+8,18))?rise+1:0;if(now-lastWheel>220||(dir&&dir!==lastDir)||rise>=2){used=false;acc=0;rise=0}if(dir)lastDir=dir;lastWheel=now;if(used&&a>0)trough=Math.min(trough,a);
 if(used||now<lock){acc=0;return}acc+=e.deltaY;if(Math.abs(acc)>30){go(cur+(acc>0?1:-1));acc=0;used=true;trough=a}},{passive:false});
// touch: one swipe = one company (momentum can't carry past the next one)
let ty0=null,tFrom=-1;
addEventListener('touchstart',e=>{ty0=null;if(!inStage()||e.touches.length>1||e.target.closest('input,textarea,.cvm'))return;ty0=e.touches[0].clientY;tFrom=goal??lastIdx},{passive:true});
addEventListener('touchmove',e=>{if(ty0===null)return;const dy=ty0-e.touches[0].clientY;if((tFrom===4&&dy>0)||(tFrom===-1&&dy<0)){ty0=null;return}if(e.cancelable)e.preventDefault()},{passive:false});
addEventListener('touchend',e=>{if(ty0===null)return;const dy=ty0-e.changedTouches[0].clientY;ty0=null;if(Math.abs(dy)>40&&performance.now()>=lock)go(tFrom+(dy>0?1:-1))},{passive:true});
addEventListener('keydown',e=>{if(!inStage()||/INPUT|TEXTAREA/.test(e.target.tagName))return;const cur=goal??lastIdx;if(['ArrowDown','PageDown',' '].includes(e.key)&&cur<4){e.preventDefault();go(cur+1)}else if(['ArrowUp','PageUp'].includes(e.key)&&cur>-1){e.preventDefault();go(cur-1)}});
// touch / scrollbar: settle on the nearest company
function settle(){if(performance.now()<lock||!inStage())return;let b=-1,d=1e9;for(let i=-1;i<5;i++){const x=Math.abs(scrollY-segTop(i));if(x<d){d=x;b=i}}if(d>4)go(b)}
function onScroll(){const total=stage.offsetHeight-innerHeight,p=Math.min(1,Math.max(0,-stage.getBoundingClientRect().top/total)),q=Math.max(0,(p-.1)/.9);
 bar.style.width=q*100+'%';
 const idx=p<.1?-1:Math.min(4,Math.floor(q*5));ticks.forEach((t,i)=>t.classList.toggle('on',i===idx));lastIdx=idx;rail.forEach(b=>b.classList.toggle('on',+b.dataset.i===idx));rfill.style.height=(mqM.matches?railFill(p):(idx+1)/5)*100+'%';clearTimeout(snapT);snapT=setTimeout(()=>{goal=null;settle()},220);{const rr=stage.getBoundingClientRect();document.body.classList.toggle('past',rr.bottom<innerHeight*.5)}swapTo(order[idx+1]);showPanel(order[idx+1])}
addEventListener('scroll',onScroll,{passive:true});
// phones: dot fill follows the scroll continuously (desktop keeps stepping per section)
function railFill(p){const P=[0,...[0,1,2,3,4].map(i=>.1+.9*((i+.5)/5))];if(p>=P[5])return 1;for(let k=0;k<5;k++)if(p<P[k+1])return (k+(p-P[k])/(P[k+1]-P[k]))/5;return 1}
// phones: section dots only while moving (not tappable)
{const rl=document.querySelector('.rail');let t;const flash=ms=>{if(!mqM.matches)return;rl.classList.add('show');clearTimeout(t);t=setTimeout(()=>rl.classList.remove('show'),ms)};addEventListener('scroll',()=>flash(1200),{passive:true});addEventListener('load',()=>flash(1800))}
// name in the nav: back to the top from anywhere; reload when already there
document.querySelector('nav .brand').addEventListener('click',e=>{if(scrollY<4)return;e.preventDefault();goal=-1;lock=performance.now()+900;scrollTo({top:0,behavior:reduce?'auto':'smooth'})});
setLang((new URLSearchParams(location.search).get('lang')||(function(){try{return localStorage.getItem('lang')}catch(e){return null}})())||'en');onScroll();

const qs=new URLSearchParams(location.search);
if(qs.get('k')){removeEventListener('scroll',onScroll);cur=qs.get('k');pending=null;liftT=0;lift=0;render(cur);if(qs.get('flip'))badge.classList.add('flipped');tip.style.display='none';
 showPanel(cur);const i=order.indexOf(cur)-1;ticks.forEach((t,j)=>t.classList.toggle('on',j===i));if(i>=0){bar.style.width=((i+.5)/5*100)+'%'};rail.forEach(b=>b.classList.toggle('on',+b.dataset.i===i));rfill.style.height=((i+1)/5*100)+'%'}if(qs.get('kof'))document.querySelector(`.review button[data-k="${qs.get('kof')}"]`).click();if(qs.get('lang'))setLang(qs.get('lang'));
