  "04": {ko: "04 · 터치 헤드폰 제스처 사용성 실험", en: "04 · Touch-headphone gesture experiment"}
};
const caseKey = "04";
const templateConfig = {rememberExpirationKey: "staticrypt_expiration", rememberPassphraseKey: "staticrypt_passphrase", replaceHtmlCallback: null, clearLocalStorageCallback: null};
const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

function setLang(l) {
  try { localStorage.setItem("lang", l) } catch (e) {}
  document.body.dataset.lang = l; document.documentElement.lang = l;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.s === l));
  document.getElementById("staticrypt-password").placeholder = l === "ko" ? "비밀번호" : "Password";
  const c = CASES[caseKey]; document.getElementById("caseName").textContent = c ? c[l] : "";
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.s));
setLang(new URLSearchParams(location.search).get("lang") || (function () { try { return localStorage.getItem("lang") } catch (e) { return null } })() || "ko");

window.onload = async function () {
  const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
  if (!isSuccessful) {
    document.getElementById("staticrypt_loading").classList.add("hidden");
    document.getElementById("staticrypt_content").classList.remove("hidden");
    document.getElementById("staticrypt-password").focus();
    if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
  }
};
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const password = document.getElementById("staticrypt-password").value,
    remember = document.getElementById("staticrypt-remember").checked;
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
  if (!isSuccessful) document.querySelector(".err").textContent = document.body.dataset.lang === "ko" ? "비밀번호가 맞지 않아요." : "That password doesn’t match.";
});
</script>
</body></html>
